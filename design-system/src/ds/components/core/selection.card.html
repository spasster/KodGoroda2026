<!-- @dsCard group="Components" viewport="700x420" name="Chips · Segmented · Slider · Stepper" subtitle="Selection & input atoms — МГТС blue" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-background-primary); font-family: var(--font-compact); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .label { font-size: 12px; color: var(--color-text-tertiary); width: 100%; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .col { max-width: 360px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Chip, SegmentedControl, Slider, Stepper } = window.DesignSystemMGTS_656a78;
  function Demo() {
    const [chips, setChips] = React.useState({ done: true });
    const [view, setView] = React.useState('list');
    const [val, setVal] = React.useState(60);
    const [qty, setQty] = React.useState(3);
    return (
      <div>
        <div className="row">
          <span className="label">Chips</span>
          <Chip selected={chips.done} onClick={()=>setChips(s=>({...s,done:!s.done}))} icon="CheckSize24StyleOutline">Согласованные</Chip>
          <Chip selected={chips.draft} onClick={()=>setChips(s=>({...s,draft:!s.draft}))}>Черновики</Chip>
          <Chip selected={chips.arch} onClick={()=>setChips(s=>({...s,arch:!s.arch}))}>Архив</Chip>
        </div>
        <div className="row">
          <span className="label">Segmented control</span>
          <SegmentedControl value={view} onChange={setView}
            segments={[{value:'list',label:'Список'},{value:'grid',label:'Плитки'},{value:'kanban',label:'Канбан'}]} />
        </div>
        <div className="row col">
          <span className="label">Slider</span>
          <Slider value={val} onChange={setVal} min={0} max={100} showValue />
        </div>
        <div className="row">
          <span className="label">Stepper</span>
          <Stepper value={qty} onChange={setQty} min={1} max={20} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
