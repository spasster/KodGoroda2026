<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-background-primary); font-family: var(--font-compact); }
  .row { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; margin-bottom: 20px; }
  .dark-row { background: var(--color-background-inverted); border-radius: var(--radius-m); padding: 16px 20px; }
  .label { font-size: 12px; color: var(--color-text-tertiary); width: 100%; text-transform: uppercase; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Logo } = window.DesignSystemMGTS_656a78;
  function Demo() {
    return (
      <div>
        <div className="row">
          <span className="label">Brand · variants</span>
          <Logo variant="full" size={32} />
          <Logo variant="mark" size={32} />
          <Logo variant="text" size={32} />
        </div>
        <div className="row">
          <span className="label">Mono</span>
          <Logo variant="full" tone="mono" size={28} />
        </div>
        <div className="row dark-row">
          <Logo variant="full" tone="inverted" size={28} />
          <Logo variant="mark" tone="inverted" size={28} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
