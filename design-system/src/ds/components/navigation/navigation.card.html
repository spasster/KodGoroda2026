<!-- @dsCard group="Components" viewport="700x360" name="Tabs · Sidebar · Breadcrumbs" subtitle="Navigation patterns with МГТС-blue active state" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--color-background-primary); font-family: var(--font-compact); }
  .label { font-size: 12px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }
  .block { margin-bottom: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Tabs, SidebarNav, Breadcrumbs } = window.DesignSystemMGTS_656a78;
  function Demo() {
    const [tab, setTab] = React.useState('all');
    const [nav, setNav] = React.useState('docs');
    return (
      <div>
        <div className="block">
          <p className="label">Breadcrumbs</p>
          <Breadcrumbs items={[{label:'Главная'},{label:'Документы'},{label:'Договор №2024-118'}]} />
        </div>
        <div className="block">
          <p className="label">Tabs</p>
          <Tabs value={tab} onChange={setTab}
            tabs={[{value:'all',label:'Все'},{value:'mine',label:'Мои'},{value:'archive',label:'Архив'}]} />
        </div>
        <div className="block" style={{ maxWidth: 280 }}>
          <p className="label">Sidebar</p>
          <SidebarNav icon="DocumentSize24StyleOutline" label="Документы" badge={12} active={nav==='docs'} onClick={()=>setNav('docs')} />
          <SidebarNav icon="ArchiveSize24StyleOutline" label="Архив" active={nav==='arch'} onClick={()=>setNav('arch')} />
          <SidebarNav icon="SettingsSize24StyleOutline" label="Настройки" active={nav==='set'} onClick={()=>setNav('set')} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
