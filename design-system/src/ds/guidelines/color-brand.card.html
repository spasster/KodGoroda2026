<!-- @dsCard group="Colors" viewport="700x180" name="Brand — МГТС Blue" subtitle="Primary accent that replaces MTS red" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--color-background-primary);font-family:var(--font-compact)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:8px}
  .chip{width:120px;height:64px;border-radius:var(--radius-m);border:1px solid var(--color-line)}
  .meta{font-size:12px;line-height:1.4}
  .name{color:var(--color-text-primary);font-weight:500}
  .hex{color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--mgts-blue-50)"></div><div class="meta"><div class="name">blue-50</div><div class="hex">#e6f4fc</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--mgts-blue-300)"></div><div class="meta"><div class="name">blue-300</div><div class="hex">#45b6fc</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--mgts-blue-500);border-color:transparent"></div><div class="meta"><div class="name">blue-500 · brand</div><div class="hex">#008ae0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--mgts-blue-600);border-color:transparent"></div><div class="meta"><div class="name">blue-600 · hover</div><div class="hex">#0072bd</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--mgts-blue-700);border-color:transparent"></div><div class="meta"><div class="name">blue-700 · active</div><div class="hex">#005c99</div></div></div>
  </div>
</body></html>
