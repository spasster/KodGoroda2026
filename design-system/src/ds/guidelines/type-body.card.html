<!-- @dsCard group="Type" viewport="700x260" name="Titles & Body — MTS Compact" subtitle="Interface titles and body text" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--color-background-primary)}
  .item{display:flex;align-items:baseline;gap:16px;margin-bottom:12px}
  .tag{font-family:var(--font-compact);font-size:12px;color:var(--color-text-tertiary);width:130px;flex-shrink:0}
  .h3{font-family:var(--font-compact);font-weight:700;font-size:20px;line-height:24px;color:var(--color-text-primary)}
  .h4{font-family:var(--font-compact);font-weight:500;font-size:17px;line-height:24px;color:var(--color-text-primary)}
  .body{font-family:var(--font-compact);font-weight:400;font-size:15px;line-height:20px;color:var(--color-text-primary)}
  .bodysm{font-family:var(--font-compact);font-weight:400;font-size:14px;line-height:20px;color:var(--color-text-secondary)}
  .cap{font-family:var(--font-compact);font-weight:400;font-size:12px;line-height:16px;color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="item"><span class="tag">Compact 700 · 20</span><span class="h3">Заголовок H3</span></div>
  <div class="item"><span class="tag">Compact 500 · 17</span><span class="h4">Подзаголовок H4</span></div>
  <div class="item"><span class="tag">Compact 400 · 15</span><span class="body">Основной текст интерфейса</span></div>
  <div class="item"><span class="tag">Compact 400 · 14</span><span class="bodysm">Вторичный текст и подписи</span></div>
  <div class="item"><span class="tag">Compact 400 · 12</span><span class="cap">Caption — мелкий вспомогательный текст</span></div>
</body></html>
