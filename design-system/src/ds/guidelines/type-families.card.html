<!-- @dsCard group="Type" viewport="700x200" name="Families — Sans & Text" subtitle="MTS Sans for long-form, MTS Text for small UI" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--color-background-primary)}
  .blk{margin-bottom:16px}
  .tag{font-family:var(--font-compact);font-size:12px;color:var(--color-text-tertiary);margin-bottom:4px}
  .sans{font-family:var(--font-sans);font-weight:400;font-size:15px;line-height:22px;color:var(--color-text-primary);max-width:560px}
  .text{font-family:var(--font-text);font-weight:400;font-size:13px;line-height:18px;color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="blk">
    <div class="tag">MTS Sans 400 · 15 — длинные тексты, описания</div>
    <div class="sans">МГТС использует MTS Sans для развёрнутых описаний и абзацев основного контента, где важна комфортная читаемость на длинных строках.</div>
  </div>
  <div class="blk">
    <div class="tag">MTS Text 400 · 13 — мелкий вспомогательный текст</div>
    <div class="text">Сноски, метаданные, технические подписи и служебная информация.</div>
  </div>
</body></html>
