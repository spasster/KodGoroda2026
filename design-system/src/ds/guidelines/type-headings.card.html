<!-- @dsCard group="Type" viewport="700x230" name="Headings — MTS Wide" subtitle="Display headings H1–H2 in MTS Wide" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--color-background-primary)}
  .item{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
  .tag{font-family:var(--font-compact);font-size:12px;color:var(--color-text-tertiary);width:120px;flex-shrink:0}
  .h1{font-family:var(--font-wide);font-weight:700;font-size:32px;line-height:36px;color:var(--color-text-primary)}
  .h2{font-family:var(--font-wide);font-weight:700;font-size:24px;line-height:28px;color:var(--color-text-primary)}
  .h2m{font-family:var(--font-wide);font-weight:500;font-size:24px;line-height:28px;color:var(--color-text-primary)}
</style></head>
<body>
  <div class="item"><span class="tag">Wide 700 · 32</span><span class="h1">Заголовок H1</span></div>
  <div class="item"><span class="tag">Wide 700 · 24</span><span class="h2">Заголовок H2</span></div>
  <div class="item"><span class="tag">Wide 500 · 24</span><span class="h2m">Акцентная подпись</span></div>
</body></html>
