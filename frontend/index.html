<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Стажировка МГТС</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23008AE0'/%3E%3Ctext x='10' y='84' textLength='80' lengthAdjust='spacingAndGlyphs' fill='%23fff' font-family='Arial Black, Arial, sans-serif' font-weight='900' font-size='26'%3E%D0%9C%D0%93%D0%A2%D0%A1%3C/text%3E%3C/svg%3E" />
    <script>
      // Тема до загрузки React, чтобы страница не мигала. Логика в src/lib/theme.ts.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
