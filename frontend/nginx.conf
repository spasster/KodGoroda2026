server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Excel с анкетами грузится через /api/import/excel.
    client_max_body_size 20m;

    # SSE: без буфера, соединение держим долго. Бэкенд шлёт ping раз в 15 секунд.
    location = /api/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Первый запрос после загрузки данных ждёт, пока модель прочитает все комментарии.
        proxy_read_timeout 10m;
    }

    # Файлы сборки с хешем в имени не меняются.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: любой путь вроде /pairs/P-03 или /form отдаёт index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Порт для make tunnel: наружу только форма. Дашборд с комментариями, импорт и
# сброс базы через туннель недоступны, даже если убрать /form из адреса.
server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html;

    location = /form {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Форме нужны анкета, список ID и приём ответа.
    location = /api/survey {
        limit_except GET { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location = /api/people {
        limit_except GET { deny all; }
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # Бэкенд по этому заголовку не отдаёт токены личных ссылок. Клиентский
        # заголовок с тем же именем nginx перезаписывает.
        proxy_set_header X-Public-Form 1;
    }

    location = /api/ingest {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
