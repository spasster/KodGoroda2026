<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid — 4 → 64" -->
<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--color-background-primary);font-family:var(--font-compact)}
  .row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px;align-items:center}
  .bar{background:var(--color-brand);border-radius:4px;width:24px}
  .val{font-size:11px;color:var(--color-text-secondary)}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="bar" style="height:4px"></div><div class="val">4</div></div>
    <div class="sw"><div class="bar" style="height:8px"></div><div class="val">8</div></div>
    <div class="sw"><div class="bar" style="height:12px"></div><div class="val">12</div></div>
    <div class="sw"><div class="bar" style="height:16px"></div><div class="val">16</div></div>
    <div class="sw"><div class="bar" style="height:20px"></div><div class="val">20</div></div>
    <div class="sw"><div class="bar" style="height:24px"></div><div class="val">24</div></div>
    <div class="sw"><div class="bar" style="height:32px"></div><div class="val">32</div></div>
    <div class="sw"><div class="bar" style="height:40px"></div><div class="val">40</div></div>
    <div class="sw"><div class="bar" style="height:48px"></div><div class="val">48</div></div>
    <div class="sw"><div class="bar" style="height:64px"></div><div class="val">64</div></div>
  </div>
</body></html>
