[project]
name = "stazhirovki-api"
version = "0.1.0"
description = "Бэкенд дашборда мониторинга стажировок"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
