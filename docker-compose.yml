# Всё в Docker: make up, потом http://localhost:8080. Переменные из .env, если он есть.
# Пути к анкете, данным и базе задаются здесь и главнее .env: там они для запуска без Docker.
services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      SURVEY_DIR: /survey
      SAMPLE_DIR: /sample
      DB_PATH: /data/app.sqlite
    volumes:
      - ./survey:/survey:ro
      - ./data/mgts:/sample:ro
      - api-data:/data
    # Ollama на этой машине: LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
      # Только форма, для make tunnel (frontend/nginx.conf, второй server).
      - "127.0.0.1:8081:81"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
